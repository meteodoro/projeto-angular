<header class="bg-[#0f0f0f] text-[#ebdcc9] px-6 md:px-10 py-2 border-b border-neutral-800">
<div class="max-w-[1440px] mx-auto flex items-center justify-between">

    <button class="md:hidden p-2 text-gray-300 hover:text-white transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <a href="/" class="flex-shrink-0 transition-opacity hover:opacity-80">
      <img src="/assets/logo.svg" alt="Solstice Records" class="h-26 md:h-26 w-auto">
    </a>

    
    <nav class="font-inter hidden md:flex items-center gap-8 text-[12px] tracking-widest font-medium uppercase">
      <a href="/" class="hover:text-[#ba3131] transition-colors">Início</a>
      <a href="/catalogo" class="hover:text-[#ba3131] transition-colors">Discos</a>
      <a href="/sobre" class="hover:text-[#ba3131] transition-colors">Sobre</a>
      <a href="/contato" class="hover:text-[#ba3131] transition-colors">Contato</a>
    </nav>

    <div class="flex items-center gap-4">
      <button class="p-1 hover:text-[#ba3131] transition-colors cursor-pointer" (click)="irParaCatalogo()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
      </button>

      <button class="relative p-1 hover:text-[#ba3131] transition-colors cursor-pointer" (click)="carrinhoService.abrir()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        @if (carrinhoService.total() > 0) {
          <span class="absolute -top-1 -right-1 bg-destaque text-creme text-[10px] w-4 h-4 rounded-full flex items-center justify-center">
            {{ carrinhoService.total() }}
          </span>
        }
      </button>

      @if (auth.logado()) {
        <span class="font-inter hidden md:inline max-w-40 truncate text-[12px] tracking-widest font-medium uppercase text-creme/60">
          {{ auth.usuario()?.nome }}
        </span>

        <button class="flex items-center gap-2 p-1 hover:text-[#ba3131] transition-colors cursor-pointer" (click)="auth.logout()" aria-label="Sair">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
          </svg>
          <span class="font-inter hidden md:inline text-[12px] tracking-widest font-medium uppercase">Sair</span>
        </button>
      } @else {
        <a routerLink="/login" class="flex items-center gap-2 p-1 hover:text-[#ba3131] transition-colors" aria-label="Entrar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
          <span class="font-inter hidden md:inline text-[12px] tracking-widest font-medium uppercase">Entrar</span>
        </a>
      }
    </div>

  </div>
</header>
