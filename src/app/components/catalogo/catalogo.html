<img src="/assets/ondas.png" alt="" class="pointer-events-none absolute -right-32 top-1/2 w-[500px] -translate-y-1/2 opacity-[0.07] rotate-6">
<img src="/assets/ondas.png" alt="" class="pointer-events-none absolute -left-32 top-1/4 w-[300px] -translate-y-1/2 -scale-x-100 opacity-[0.07] rotate-6">
<img src="/assets/ondas.png" alt="" class="pointer-events-none absolute -left-32 top-3/4 w-[500px] -translate-y-1/2 -scale-x-100 opacity-[0.07] rotate-6">
<img src="/assets/ondas.png" alt="" class="pointer-events-none absolute -right-12 w-[200px] -translate-y-1/2 opacity-[0.07] rotate-6">


<section class="px-8 md:px-16 lg:px-24 py-12">
    @if (carregando()) {
        <p class="text-center py-24 text-creme/70">Carregando catálogo...</p>
    }
    @else if (erro()) {
        <p class="text-center py-24 text-red-400">{{ erro() }}</p>
    }
    @else {
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-8">
            <div>
                <h1 class="font-titulo text-2xl font-bold tracking-wide">DISCOS</h1>
                <p class="text-sm text-creme/60 mt-1">{{ total() }} discos encontrados</p>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-80">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-creme/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input [ngModel]="busca()" (ngModelChange)="busca.set($event)" placeholder="Buscar por título ou artista"
                        class="w-full pl-9 pr-4 py-2 rounded-full bg-transparent border border-creme/20 text-sm text-creme placeholder:text-creme/40 focus:outline-none focus:border-destaque transition-colors"
                    />
                </div>

                <button
                    (click)="mostrarSoFavoritos.set(!mostrarSoFavoritos())"
                    [class.text-destaque]="mostrarSoFavoritos()"
                    [class.border-destaque]="mostrarSoFavoritos()"
                    class="border border-creme/20 rounded-full px-4 py-2 text-sm flex items-center gap-2 transition-colors shrink-0"
                >
                    {{ mostrarSoFavoritos() ? '♥' : '♡' }} Favoritos
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
        @for (disco of discosFiltrados(); track disco.id) {
            <app-disco-card [disco]="disco" (favoritar)="onFavoritar($event)" />
        } 
        @empty {
            <p class="col-span-full text-center py-24 text-creme/60">Nenhum disco bate com essa busca.</p>
        }
        </div>
    }
</section>
