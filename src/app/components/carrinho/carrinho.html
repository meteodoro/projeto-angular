<div class="fixed inset-0 bg-black/60 z-40 transition-opacity duration-300" [class.opacity-100]="carrinhoService.estaAberto()"
    [class.opacity-0]="!carrinhoService.estaAberto()" [class.pointer-events-none]="!carrinhoService.estaAberto()" (click)="fechar()"></div>

<aside class="fixed top-0 right-0 h-full w-full max-w-sm bg-fundo text-creme z-50 flex flex-col shadow-xl transition-transform duration-300" 
    [class.translate-x-0]="carrinhoService.estaAberto()" [class.translate-x-full]="!carrinhoService.estaAberto()">
    <div class="flex items-center justify-between px-6 py-4 border-b border-creme/10">
        <h2 class="font-titulo text-lg font-bold">SEU CARRINHO</h2>
        <button (click)="fechar()" class="text-creme/60 hover:text-creme text-2xl leading-none">&times;</button>
    </div>

    <div class="flex-1 overflow-y-auto px-6 py-4 flex flex-col gap-4">
        @for (disco of carrinhoService.lista(); track disco.id) {
            <div class="flex gap-3 items-center">
                <img [src]="disco.capa" [alt]="disco.titulo" class="w-14 h-14 rounded object-cover" />
                <div class="flex-1">
                    <p class="text-sm font-bold">{{ disco.titulo }}</p>
                    <p class="text-xs text-creme/60">{{ disco.artista }}</p>
                    <p class="text-sm mt-1">R$ {{ disco.preco | number:'1.2-2' }}</p>
                </div>
                <button (click)="remover(disco.id)" class="text-creme/40 hover:text-red-400 text-xs">Remover</button>
            </div>
        } 
        @empty {
            <p class="text-center text-creme/50 py-12">Seu carrinho está vazio.</p>
        }
    </div>

    @if (carrinhoService.total() > 0) {
        <div class="px-6 py-4 border-t border-creme/10">
            <div class="flex justify-between mb-4 text-sm">
                <span class="text-creme/70">Total</span>
                <span class="font-bold">R$ {{ carrinhoService.totalPreco() | number:'1.2-2' }}</span>
            </div>
            <button class="w-full bg-destaque text-creme py-3 rounded-md text-sm tracking-widest font-inter">CONCLUIR COMPRA</button>
        </div>
    }
</aside>
